[project]
name = "mcp-gateway-auth"
version = "0.1.0"
description = "Verification of MCP Gateway internal JWTs for company MCP servers"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
fastmcp = ["fastmcp>=2.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway_auth"]
